# Static personal site at the domain root. Prefix locations of other services are
# longer and therefore still take precedence over "location /".
location / {
    root /var/www/ac-site/current;
    try_files $uri $uri/ =404;
    error_page 404 /404.html;
    # Relative directory redirects (/name -> /name/) keep the client's scheme and host.
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;
    # add_header in a location replaces inherited headers, so repeat the full set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css image/svg+xml;
}

# The former English edition at /en/ redirects to the root.
location ~ ^/en/?$ {
    absolute_redirect off;
    return 301 /;
}

# Hashed build output never changes in place.
location ^~ /_astro/ {
    root /var/www/ac-site/current;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css image/svg+xml;
}
