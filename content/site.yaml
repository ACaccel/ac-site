# Every short text on the site: navigation, titles, descriptions, buttons, and labels.
# Long texts are Markdown files in this folder: about.md, now.md, posts/, projects/, albums/.
#
# - Words in braces, such as {count}, are filled in by the site; keep them in the text.
# - {name} works in every text and becomes profile.name.
# - The build fails on a missing or misspelled key, so a typo never goes live.
# - Texts marked optional may be deleted or left empty ('') to hide them.

profile:
  name: ACaccel
  # One sentence under the name on the homepage.
  tagline: B.S. & M.S. in Electrical Engineering, National Taiwan University.
  # Optional; shown as an Email button and footer link.
  email: acaccel8763@gmail.com
  links:
    - label: GitHub
      href: https://github.com/ACaccel
    - label: Discord
      href: https://discord.com/users/844172941695516682

site:
